function uid() {

function todayStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function fmtDateShort(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${days[d.getDay()]})`;
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(todayStr() + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

}

// 달력 그리드용 — 해당 연/월(month는 0부터 시작)을 앞뒤 빈 칸까지 포함해 7일씩 묶은 주 배열로 반환
function buildCalendarWeeks(year, month) {
  const firstOfMonth = new Date(year, month, 1);
  const startDay = firstOfMonth.getDay(); // 0=일요일
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = startDay - 1; i >= 0; i--) {
    cells.push({ date: new Date(year, month - 1, daysInPrevMonth - i), inMonth: false });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ date: new Date(year, month, d), inMonth: true });
  }
  while (cells.length % 7 !== 0) {
    const last = cells[cells.length - 1].date;
    const next = new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1);
    cells.push({ date: next, inMonth: false });
  }
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

function downloadICS(title, dateStr) {
  if (!dateStr) return;
  const dt = dateStr.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const esc = s => String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//WorkJournal//KO', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid()}@workjournal`,
    `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${dt}`,
    `DTEND;VALUE=DATE:${dt}`,
    `SUMMARY:${esc(title)}`,
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(title || '할일').slice(0, 40)}.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64.replace(/\n/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

async function ghFetch(cfg, path, opts = {}) {
  const url = `${GH_API}/repos/${cfg.owner}/${cfg.repo}/contents/${path}${opts.query || ''}`;
  // 네트워크가 불안정할 때 요청이 응답도 실패도 없이 무한정 걸려있는 걸 막기 위한 타임아웃
  // (이게 없으면 "저장 중…"이 화면에서 영원히 안 사라지는 버그가 생김)
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);
  try {
    return await fetch(url, {
      method: opts.method || 'GET',
      headers: {
        Authorization: `Bearer ${cfg.token}`,
        Accept: opts.accept || 'application/vnd.github+json',
        ...(opts.method === 'PUT' || opts.method === 'DELETE' ? { 'Content-Type': 'application/json' } : {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      signal: controller.signal,
    });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('요청 시간이 초과됐어요. 네트워크 상태를 확인하고 다시 시도해주세요.');
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
}

async function ghGetJSON(cfg, path) {
  const res = await ghFetch(cfg, path, { query: `?ref=${cfg.branch || 'main'}` });
  if (res.status === 404) return { data: [], sha: null };
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `GitHub 읽기 실패 (${res.status})`);
  }
  const json = await res.json();
  let data = [];
  try { data = JSON.parse(base64ToUtf8(json.content)); } catch (e) { data = []; }
  return { data: Array.isArray(data) ? data : [], sha: json.sha };
}

async function ghPutJSON(cfg, path, dataArr, sha, message) {
  const body = {
    message: message || `update ${path}`,
    content: utf8ToBase64(JSON.stringify(dataArr, null, 2)),
    branch: cfg.branch || 'main',
  };
  if (sha) body.sha = sha;
  const res = await ghFetch(cfg, path, { method: 'PUT', body });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub 저장 실패 (${res.status})`);
  }
  const json = await res.json();
  return json.content.sha;
}

async function ghPutImage(cfg, path, base64Content, message) {
  const body = { message: message || `add ${path}`, content: base64Content, branch: cfg.branch || 'main' };
  const res = await ghFetch(cfg, path, { method: 'PUT', body });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `이미지 업로드 실패 (${res.status})`);
  }
  return path;
}

/* ===========================================================
   다중 레포(보관/archive) 헬퍼
   — 레포를 전환(로테이션)해도 예전 레포를 읽기 전용으로 함께 보여주고,
     예외적으로 수정할 때는 그 항목이 원래 있던 레포에만 정확히 다시 쓰기 위한 유틸들
=========================================================== */
async function ghDeleteFile(cfg, path, message) {
  // 삭제하려면 현재 파일의 sha가 필요해서 먼저 조회
  const getRes = await ghFetch(cfg, path, { query: `?ref=${cfg.branch || 'main'}` });
  if (getRes.status === 404) return; // 이미 없음 — 조용히 넘어감
  if (!getRes.ok) throw new Error(`파일 조회 실패 (${getRes.status})`);
  const json = await getRes.json();
  const res = await ghFetch(cfg, path, {
    method: 'DELETE',
    body: { message: message || `delete ${path}`, sha: json.sha, branch: cfg.branch || 'main' },
  });
  if (!res.ok && res.status !== 404) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `파일 삭제 실패 (${res.status})`);
  }
}

async function ghGetRepoInfo(cfg) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);
  let res;
  try {
    res = await fetch(`${GH_API}/repos/${cfg.owner}/${cfg.repo}`, {
      headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' },
      signal: controller.signal,
    });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('요청 시간이 초과됐어요.');
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
  if (!res.ok) throw new Error(`레포 정보 조회 실패 (${res.status})`);
  const json = await res.json();
  return { sizeKB: json.size || 0 }; // GitHub API가 KB 단위로 보고 (실제 반영까지 약간의 지연 있을 수 있음)
}

// 보관된(archive) 레포 정보로 접근할 때 쓸 cfg를 만들어줌 (토큰은 공유, owner/repo/branch만 교체)
function repoCfgFor(cfg, repoTag) {
  if (!repoTag) return cfg;
  return { ...cfg, owner: repoTag.owner, repo: repoTag.repo, branch: repoTag.branch || 'main' };
}
function repoKeyOf(repoTag) {
  return repoTag ? `${repoTag.owner}/${repoTag.repo}` : '';
}
// 레코드에 붙여둔 _repo/_readonly/_repoLabel 태그는 앱 내부 표시용이라, 실제 저장 전엔 반드시 제거
function stripMeta(item) {
  const { _repo, _readonly, _repoLabel, ...rest } = item;
  return rest;
}

// entries/quickNotes 전체를 훑어서 현재 사용 중인 이미지 경로 집합을 만듦.
// (opts로 지금 삭제하려는 항목 자신은 제외하고 계산)
function collectImagePaths(entriesArr, notesArr, opts = {}) {
  const set = new Set();
  (entriesArr || []).forEach(e => {
    if (opts.excludeEntryId && e.id === opts.excludeEntryId) return;
    (e.images || []).forEach(r => { if (r && r.thumb) set.add(r.thumb); if (r && r.original) set.add(r.original); });
  });
  (notesArr || []).forEach(n => {
    if (opts.excludeNoteId && n.id === opts.excludeNoteId) return;
    (n.imageRefs || []).forEach(r => { if (r && r.thumb) set.add(r.thumb); if (r && r.original) set.add(r.original); });
  });
  return set;
}

// imageRefs 중 다른 곳에서 더 이상 참조하지 않는 것만 실제로 레포에서 삭제.
// 개별 파일 삭제가 실패해도 나머지는 계속 진행 (사진 삭제 실패로 전체 작업이 막히지 않도록).
async function deleteOrphanedImages(cfg, imageRefs, inUseSet, messagePrefix) {
  for (const ref of (imageRefs || [])) {
    for (const p of [ref && ref.thumb, ref && ref.original]) {
      if (p && !inUseSet.has(p)) {
        try { await ghDeleteFile(cfg, p, `${messagePrefix} (사진 정리): ${p}`); } catch (e) { /* 개별 실패는 무시하고 계속 */ }
      }
    }
  }
}

async function ghGetImageBlobUrl(cfg, path) {
  const res = await ghFetch(cfg, path, { query: `?ref=${cfg.branch || 'main'}`, accept: 'application/vnd.github.raw+json' });
  if (!res.ok) throw new Error('이미지 로드 실패');
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

async function ghTestConnection(cfg) {
  const res = await ghFetch(cfg, '', { query: '' });
  if (res.status === 401) throw new Error('토큰이 올바르지 않거나 만료되었습니다.');
  if (res.status === 404) throw new Error('레포지토리를 찾을 수 없습니다. 계정명·레포 이름을 확인해주세요. (레포가 완전히 비어있으면 404가 뜰 수 있어요 — README와 함께 생성했는지 확인)');
  if (res.status === 403) throw new Error('접근이 거부되었습니다. 토큰 권한(Contents: Read and write)을 확인해주세요.');
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `연결 실패 (${res.status})`);
  }
  return true;
}

/* ===========================================================
   이미지 파일 처리 유틸 (압축, base64 변환 등)
=========================================================== */
function compressImage(file, maxSize = 1600, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
    reader.onload = e => {
      const img = new window.Image();
      img.onerror = () => reject(new Error('이미지를 처리하지 못했습니다.'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          if (width > height) { height = Math.round(height * maxSize / width); width = maxSize; }
          else { width = Math.round(width * maxSize / height); height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl.split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
    reader.onload = e => resolve(e.target.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
}

function extFromFile(file) {
  const byType = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/heic': 'heic', 'image/heif': 'heif', 'image/gif': 'gif' };
  if (byType[file.type]) return byType[file.type];
  const parts = (file.name || '').split('.');
  return parts.length > 1 ? parts.pop().toLowerCase() : 'jpg';
}

/* 이미지 참조 형식 호환 — 예전 데이터는 문자열 경로 하나, 새 데이터는 {thumb, original} 객체 */
function imgPaths(ref) {
  if (typeof ref === 'string') return { thumb: ref, original: ref };
  return { thumb: ref.thumb, original: ref.original || ref.thumb };
}

/* ===========================================================
   GitHub 이미지 캐시 훅
=========================================================== */
const imageUrlCache = new Map();
function useGhImage(cfg, path) {
  const [url, setUrl] = useState(() => imageUrlCache.get(path) || null);
  useEffect(() => {
    let cancelled = false;
    if (!path || !cfg) return;
    if (imageUrlCache.has(path)) { setUrl(imageUrlCache.get(path)); return; }
    ghGetImageBlobUrl(cfg, path).then(u => {
      if (!cancelled) { imageUrlCache.set(path, u); setUrl(u); }
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [path, cfg]);
  return url;
}
function GhImage({ cfg, path, originalPath, className }) {
  const url = useGhImage(cfg, path);
  if (!url) return <div className={`bg-slate-200 dark:bg-slate-800 animate-pulse ${className}`} />;
  return (
    <img src={url} className={`${className} cursor-zoom-in`}
      onClick={() => window.dispatchEvent(new CustomEvent('wj-lightbox-open', { detail: { cfg, path: originalPath || path } }))} />
  );
}

function GlobalLightbox() {
  const [state, setState] = useState(null);
  const [url, setUrl] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    const handler = e => { setState(e.detail); setUrl(null); setError(''); };
    window.addEventListener('wj-lightbox-open', handler);
    return () => window.removeEventListener('wj-lightbox-open', handler);
  }, []);

  useEffect(() => {
    if (!state) return;
    let cancelled = false;
    setLoading(true);
    ghGetImageBlobUrl(state.cfg, state.path)
      .then(u => { if (!cancelled) { setUrl(u); setLoading(false); } })
      .catch(() => { if (!cancelled) { setError('원본을 불러오지 못했습니다.'); setLoading(false); } });
    return () => { cancelled = true; };
  }, [state]);

  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') setState(null); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  if (!state) return null;

  const handleDownload = () => {
    if (!url) return;
    const a = document.createElement('a');
    a.href = url;
    a.download = state.path.split('/').pop();
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  return (
    <div className="fixed inset-0 z-[80] flex flex-col items-center justify-center bg-black/90 p-4 wj-modal-pop gap-3" onClick={() => setState(null)}>
      <button onClick={() => setState(null)} className="absolute top-4 right-4 p-2 rounded-full bg-white/10 text-white hover:bg-white/20 active:scale-90 transition-all">
        <X size={20} />
      </button>
      {loading && <LoaderCircle size={26} className="text-white/70 wj-spin" />}
      {error && <p className="text-white/80 text-[13px]">{error}</p>}
      {url && (
        <React.Fragment>
          <img src={url} className="max-w-full max-h-[78vh] object-contain rounded-lg" onClick={e => e.stopPropagation()} />
          <button onClick={e => { e.stopPropagation(); handleDownload(); }}
            className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-white/10 text-white text-[13px] font-medium hover:bg-white/20 active:scale-95 transition-all">
            <Download size={14} /> 원본 다운로드
          </button>
        </React.Fragment>
      )}
    </div>
  );
}

function SettingsPanel({ initial, onSave, onDisconnect, embedded }) {
  const [owner, setOwner] = useState(initial?.owner || '');
  const [repo, setRepo] = useState(initial?.repo || '');
  const [branch, setBranch] = useState(initial?.branch || 'main');
  const [token, setToken] = useState(initial?.token || '');
  const [testing, setTesting] = useState(false);
  const [testMsg, setTestMsg] = useState(null);
  const [verified, setVerified] = useState(false);

  const canSubmit = owner.trim() && repo.trim() && token.trim();

  const invalidate = () => { setVerified(false); setTestMsg(null); };
  const handleOwnerChange = v => { setOwner(v); invalidate(); };
  const handleRepoChange = v => { setRepo(v); invalidate(); };
  const handleBranchChange = v => { setBranch(v); invalidate(); };
  const handleTokenChange = v => { setToken(v); invalidate(); };

  const handleTest = async () => {
    if (!canSubmit) return;
    setTesting(true); setTestMsg(null); setVerified(false);
    try {
      await ghTestConnection({ owner: owner.trim(), repo: repo.trim(), branch: branch.trim() || 'main', token: token.trim() });

      setVerified(true);

      setTestMsg({ ok: false, msg: err.message });
      setVerified(false);
    } finally {
      setTesting(false);
    }

            <label className="flex items-center gap-1.5 text-[11px] font-medium text-slate-400 mb-1.5">
              <Key size={11} /> Personal Access Token (fine-grained, 이 레포 Contents: Read and write)
            </label>
            <input type="password" value={token} onChange={e => handleTokenChange(e.target.value)} placeholder="github_pat_..."
              className="w-full min-w-0 px-3 py-2 rounded-lg text-[13px] bg-slate-800 border border-slate-700 text-slate-200 placeholder:text-slate-500 font-mono" />
          </div>

          {testMsg && (
            <div className={`text-[12px] px-3 py-2 rounded-lg leading-relaxed ${testMsg.ok ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}`}>
              {testMsg.msg}
            </div>
          )}

          <div className="flex items-center gap-2 pt-1">
            <button onClick={handleTest} disabled={!canSubmit || testing}
              className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-[12.5px] font-medium border border-slate-700 text-slate-300 hover:bg-slate-800 active:scale-[0.97] disabled:opacity-40 disabled:active:scale-100 transition-all">
              {testing ? <LoaderCircle size={13} className="wj-spin" /> : <Link2 size={13} />}
              연결 테스트
            </button>
            <button onClick={handleSave} disabled={!canSubmit || !verified}
              title={!verified ? '먼저 연결 테스트를 통과해야 저장할 수 있어요' : ''}
              className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-[12.5px] font-semibold bg-[#45C4B0] text-[#1a1206] hover:brightness-105 active:scale-[0.97] disabled:opacity-40 disabled:active:scale-100 transition-all">
              <Check size={13} strokeWidth={2.5} /> 저장하고 시작
            </button>
          </div>
          {canSubmit && !verified && !testing && (
            <p className="text-[11px] text-slate-500 text-center -mt-2">먼저 "연결 테스트"를 통과해야 저장할 수 있어요.</p>
          )}

          {onDisconnect && (
            <button onClick={onDisconnect} className="w-full flex items-center justify-center gap-1.5 text-[12px] text-slate-500 hover:text-red-400 pt-1">
              <LogOut size={12} /> 연결 해제 (이 기기에서 설정 삭제)
            </button>
          )}
        </div>

        {!embedded && (
          <p className="text-[11px] text-slate-500 text-center mt-4 leading-relaxed">
            아직 비공개 레포나 토큰을 안 만드셨다면, 먼저 GitHub에서<br />
            ① 새 비공개 레포 생성(README 포함) → ② Settings → Developer settings →<br />
            Fine-grained tokens에서 그 레포만 골라 Contents 권한 Read/Write로 토큰 발급
          </p>
        )}
      </div>
    </div>
  );
}

const REPO_SIZE_MAX_MB = 1024;   // GitHub 권장 상한(약 1GB)
const REPO_SIZE_WARN_MB = 800;   // 이 이상이면 경고 표시

// 설정 탭 — 활성 레포의 GitHub 용량(size)을 보여주는 카드 (1GB 권장 상한 기준 경고 표시)
function RepoUsagePanel({ cfg }) {
  const [sizeKB, setSizeKB] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const load = useCallback(async () => {
    setLoading(true);
    setError('');
    try {
      const info = await ghGetRepoInfo(cfg);
      setSizeKB(info.sizeKB);
    } catch (err) {
      setError(err.message || '조회 실패');
    } finally {
      setLoading(false);
    }
  }, [cfg]);

  useEffect(() => { load(); }, [load]);

  const usedMB = sizeKB != null ? sizeKB / 1024 : null;
  const pct = usedMB != null ? Math.min(100, (usedMB / REPO_SIZE_MAX_MB) * 100) : 0;
  const isWarn = usedMB != null && usedMB >= REPO_SIZE_WARN_MB;
  const barColor = isWarn ? '#F0654A' : '#45C4B0';

  return (
    <div className="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4">
      <div className="flex items-center justify-between mb-2.5">
        <div className="flex items-center gap-2 text-[13px] text-slate-600 dark:text-slate-300">
          <DatabaseIcon size={14} /> 데이터 레포 용량
        </div>
        <button onClick={load} disabled={loading} title="새로고침"
          className="p-1.5 rounded-md text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all disabled:opacity-50">
          <RefreshCw size={12.5} className={loading ? 'wj-spin' : ''} />
        </button>
      </div>

      {error ? (
        <p className="text-[11px] text-red-400">{error}</p>
      ) : usedMB == null ? (
        <div className="h-2 rounded-full bg-slate-100 dark:bg-slate-800 animate-pulse" />
      ) : (
        <React.Fragment>
          <div className="h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
            <div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, background: barColor }} />
          </div>
          <div className="flex items-center justify-between mt-1.5">
            <span className="text-[11.5px] font-mono text-slate-500 dark:text-slate-400">
              {usedMB < 1 ? `${sizeKB} KB` : `${usedMB.toFixed(1)} MB`} / {REPO_SIZE_MAX_MB} MB
            </span>
            <span className="text-[11px] font-mono text-slate-400 dark:text-slate-500">{pct.toFixed(1)}%</span>
          </div>
          {isWarn && (
            <div className="mt-2 flex items-start gap-1.5 text-[11px] text-amber-500">
              <AlertTriangle size={13} className="shrink-0 mt-[1px]" />
              <span>용량이 {REPO_SIZE_WARN_MB}MB를 넘었어요. 새 데이터 레포로 옮길 준비를 해두는 게 좋아요.</span>
            </div>
          )}
          <p className="text-[10.5px] text-slate-400 dark:text-slate-600 mt-1.5 leading-relaxed">
            GitHub이 집계한 값이라 실제 반영까지 약간 지연될 수 있어요.
          </p>
        </React.Fragment>
      )}
    </div>
  );
}

// 설정 탭 — 보관된 레포 목록 표시 + 새 데이터 레포로 전환(로테이션)하는 폼
function RepoArchivePanel({ cfg, onRotate }) {
  const [expanded, setExpanded] = useState(false);
  const [newRepo, setNewRepo] = useState('');
  const [newBranch, setNewBranch] = useState('main');
  const [label, setLabel] = useState('');
  const [testing, setTesting] = useState(false);
  const [testMsg, setTestMsg] = useState(null);
  const [verified, setVerified] = useState(false);

  const archives = cfg.archives || [];
  const invalidate = () => { setVerified(false); setTestMsg(null); };

  const handleTest = async () => {
    if (!newRepo.trim()) return;
    setTesting(true); setTestMsg(null); setVerified(false);
    try {
      await ghTestConnection({ owner: cfg.owner, repo: newRepo.trim(), branch: newBranch.trim() || 'main', token: cfg.token });
      setTestMsg({ ok: true, msg: '연결 성공! 이 레포로 전환할 수 있어요.' });
      setVerified(true);
    } catch (err) {
      setTestMsg({ ok: false, msg: err.message });
    } finally {
      setTesting(false);
    }
  };

  const handleRotate = () => {
    if (!verified) return;
    if (!window.confirm(`지금 레포를 "${newRepo.trim()}"(으)로 전환할까요?\n\n현재 레포(${cfg.repo})는 보관 처리되어 계속 읽을 수 있고, 앞으로 새로 쓰는 기록만 새 레포에 저장돼요.`)) return;
    const archivedEntry = { owner: cfg.owner, repo: cfg.repo, branch: cfg.branch || 'main', label: label.trim() || cfg.repo, archivedAt: Date.now() };
    onRotate({ ...cfg, repo: newRepo.trim(), branch: newBranch.trim() || 'main', archives: [archivedEntry, ...archives] });
    setNewRepo(''); setLabel(''); setVerified(false); setTestMsg(null); setExpanded(false);
  };

  return (
    <div className="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4">
      <button onClick={() => setExpanded(v => !v)} className="w-full flex items-center justify-between text-[13px] text-slate-600 dark:text-slate-300">
        <span className="flex items-center gap-2"><DatabaseIcon size={14} /> 데이터 레포 관리{archives.length > 0 ? ` (보관 ${archives.length}개)` : ''}</span>
        <ChevronDown size={14} className={expanded ? 'rotate-180 transition-transform' : 'transition-transform'} />
      </button>

      {expanded && (
        <div className="mt-3 space-y-4">
          <div>
            <p className="text-[11.5px] text-slate-500 dark:text-slate-400 mb-1.5">
              현재 쓰는 중: <span className="font-mono text-slate-700 dark:text-slate-200">{cfg.owner}/{cfg.repo}</span>
            </p>
            {archives.length > 0 && (
              <div className="space-y-1 mt-2">
                {archives.map((a, i) => (
                  <a key={i} href={`https://github.com/${a.owner}/${a.repo}`} target="_blank" rel="noopener noreferrer"
                    className="flex items-center justify-between text-[11.5px] px-2.5 py-1.5 rounded-md bg-slate-50 dark:bg-slate-800/60 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-colors">
                    <span className="font-mono truncate">{a.owner}/{a.repo}</span>
                    <span className="text-slate-400 dark:text-slate-600 shrink-0 ml-2">보관됨 · {a.label}</span>
                  </a>
                ))}
              </div>
            )}
          </div>

          <div className="border-t border-slate-100 dark:border-slate-800 pt-3">
            <p className="text-[11.5px] font-medium text-slate-600 dark:text-slate-300 mb-2">새 데이터 레포로 전환</p>
            <p className="text-[10.5px] text-slate-400 dark:text-slate-500 leading-relaxed mb-2.5">
              GitHub에서 새 비공개 레포를 먼저 만들고(README 포함), 지금 쓰는 토큰의 "레포 접근" 목록에 그 레포도 추가해주세요. 그다음 아래에 이름을 입력하고 연결 테스트 후 전환하면 돼요. 전환해도 지금 레포는 그대로 남고, 목록에서 계속 읽기 전용으로 보여요.
            </p>
            <div className="grid grid-cols-2 gap-2 mb-2">
              <input value={newRepo} onChange={e => { setNewRepo(e.target.value); invalidate(); }} placeholder="새 레포 이름"
                className="min-w-0 px-2.5 py-1.5 rounded-md text-[12.5px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500" />
              <input value={newBranch} onChange={e => { setNewBranch(e.target.value); invalidate(); }} placeholder="main"
                className="min-w-0 px-2.5 py-1.5 rounded-md text-[12.5px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500" />
            </div>
            <input value={label} onChange={e => setLabel(e.target.value)} placeholder="지금 레포에 붙일 라벨 (예: 2026-09, 비워두면 레포 이름 사용)"
              className="w-full min-w-0 px-2.5 py-1.5 rounded-md text-[12.5px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500 mb-2" />

            {testMsg && (
              <div className={`text-[11px] px-2.5 py-1.5 rounded-md mb-2 leading-relaxed ${testMsg.ok ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-400'}`}>{testMsg.msg}</div>
            )}

            <div className="flex items-center gap-2">
              <button onClick={handleTest} disabled={!newRepo.trim() || testing}
                className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-md text-[12px] font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-[0.97] disabled:opacity-40 disabled:active:scale-100 transition-all">
                {testing ? <LoaderCircle size={12} className="wj-spin" /> : <Link2 size={12} />} 연결 테스트
              </button>
              <button onClick={handleRotate} disabled={!verified}
                title={!verified ? '먼저 연결 테스트를 통과해야 전환할 수 있어요' : ''}
                className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-md text-[12px] font-semibold bg-[#45C4B0] text-[#1a1206] hover:brightness-105 active:scale-[0.97] disabled:opacity-40 disabled:active:scale-100 transition-all">
                <ArrowRight size={12} /> 이 레포로 전환
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

}

/* ===========================================================
   빠른 기록 탭

function NoteEditModal({ open, note, cfg, onClose, onSave, saving }) {
  const [text, setText] = useState('');
  const [keepImages, setKeepImages] = useState([]);
  const [newFiles, setNewFiles] = useState([]);
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (open && note) {
      setText(note.text || '');
      setKeepImages(note.imageRefs || []);
      setNewFiles([]);
    }
  }, [open, note]);

  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape' && open) onClose(); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  if (!open || !note) return null;

  const totalImages = keepImages.length + newFiles.length;
  const handleFiles = e => {
    const list = Array.from(e.target.files || []);
    setNewFiles(prev => [...prev, ...list].slice(0, Math.max(0, 4 - keepImages.length)));
    e.target.value = '';
  };
  const removeKeep = path => setKeepImages(prev => prev.filter(p => p !== path));
  const removeNew = idx => setNewFiles(prev => prev.filter((_, i) => i !== idx));
  const handleSubmit = e => {
    e.preventDefault();
    onSave(note, text.trim(), keepImages, newFiles);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center p-0 sm:p-6 overflow-y-auto">
      <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm" onClick={onClose} />
      <form onSubmit={handleSubmit} className="wj-modal-pop relative w-full sm:max-w-md bg-white dark:bg-slate-900 sm:rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl my-0 sm:my-8 max-h-[100vh] sm:max-h-[85vh] flex flex-col">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-200 dark:border-slate-800 shrink-0">
          <h2 className="text-[15px] font-semibold text-slate-800 dark:text-slate-100">빠른 기록 수정</h2>
          <button type="button" onClick={onClose} className="p-1.5 rounded-md text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800"><X size={16} /></button>
        </div>
        <div className="px-5 py-4 space-y-3 overflow-y-auto">
          <textarea value={text} onChange={e => setText(e.target.value)} rows={4}
            className="w-full px-3 py-2 rounded-lg text-[13.5px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 resize-none" />
          {(keepImages.length > 0 || newFiles.length > 0) && (
            <div className="flex items-center gap-2 flex-wrap">
              {keepImages.map((ref, idx) => {
                const { thumb, original } = imgPaths(ref);
                return (
                  <div key={thumb + idx} className="relative w-14 h-14 rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700">
                    <GhImage cfg={cfg} path={thumb} originalPath={original} className="w-full h-full object-cover" />
                    <button type="button" onClick={() => removeKeep(ref)} className="absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-black/70 text-white flex items-center justify-center active:scale-90 transition-transform"><X size={10} /></button>
                  </div>
                );
              })}
              {newFiles.map((f, i) => (
                <div key={i} className="relative w-14 h-14 rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700">
                  <img src={URL.createObjectURL(f)} className="w-full h-full object-cover" />
                  <button type="button" onClick={() => removeNew(i)} className="absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-black/70 text-white flex items-center justify-center active:scale-90 transition-transform"><X size={10} /></button>
                </div>
              ))}
            </div>
          )}
          <div>
            <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={totalImages >= 4}
              className="inline-flex items-center gap-1.5 text-[12px] font-medium px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 active:scale-95 transition-all">
              <Camera size={13} /> 사진 추가 {totalImages > 0 && `(${totalImages}/4)`}
            </button>
            <input ref={fileInputRef} type="file" accept="image/*" multiple className="hidden" onChange={handleFiles} />
          </div>
        </div>
        <div className="flex items-center justify-end gap-2 px-5 py-4 border-t border-slate-200 dark:border-slate-800 shrink-0">
          <button type="button" onClick={onClose} className="px-3.5 py-2 rounded-lg text-[13px] font-medium text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">취소</button>
          <button type="submit" disabled={saving}
            className="px-4 py-2 rounded-lg text-[13px] font-semibold bg-[#45C4B0] text-[#1a1206] hover:brightness-105 active:scale-[0.97] disabled:opacity-40 transition-all inline-flex items-center gap-1.5">
            {saving && <LoaderCircle size={13} className="wj-spin" />} 수정 저장
          </button>
        </div>
      </form>
    </div>
  );
}

// 스와이프해서 삭제 — 모바일 터치로 왼쪽으로 밀면 삭제, 데스크탑에선 그냥 감싸기만 함 (기존 삭제 버튼은 그대로 유지)
function SwipeToDelete({ onDelete, disabled, children }) {
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startRef = useRef(null);
  const axisRef = useRef(null);
  const THRESHOLD = -84;

  const onTouchStart = e => {
    if (disabled) return;
    const t = e.touches[0];
    startRef.current = { x: t.clientX, y: t.clientY };
    axisRef.current = null;
    setDragging(true);
  };
  const onTouchMove = e => {
    if (disabled || !startRef.current) return;
    const t = e.touches[0];
    const dx = t.clientX - startRef.current.x;
    const dy = t.clientY - startRef.current.y;
    if (!axisRef.current) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      axisRef.current = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (axisRef.current === 'x') setDragX(Math.max(-110, Math.min(0, dx)));
  };
  const onTouchEnd = () => {
    if (disabled || !startRef.current) return;
    setDragging(false);
    if (dragX <= THRESHOLD) onDelete();
    setDragX(0);
    startRef.current = null;
    axisRef.current = null;
  };

  return (
    <div className="relative">
      <div className="absolute inset-0 rounded-xl flex items-center justify-end pr-5 bg-red-500 text-white">
        <Trash2 size={17} />
      </div>
      <div
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        style={{ transform: `translateX(${dragX}px)`, transition: dragging ? 'none' : 'transform 0.2s ease' }}>
        {children}
      </div>
    </div>
  );
}

function TodoTab({ todos, onAdd, onToggle, onDelete }) {
  const [text, setText] = useState('');
  const [due, setDue] = useState('');
  const [showDone, setShowDone] = useState(false);
  const [completingId, setCompletingId] = useState(null);

  const handleToggleAnimated = t => {
    if (t.done) { onToggle(t); return; } // 완료 취소는 바로 처리
    setCompletingId(t.id);
    setTimeout(() => {
      onToggle(t);
      setCompletingId(null);
    }, 260);
  };

  const { pending, done, overdueCount, todayCount } = useMemo(() => {
    const p = todos.filter(t => !t.done).sort((a, b) => (a.due || '9999-99-99').localeCompare(b.due || '9999-99-99'));
    const d = todos.filter(t => t.done).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    let od = 0, tc = 0;
    p.forEach(t => {
      if (!t.due) return;
      const diff = daysUntil(t.due);
      if (diff < 0) od++; else if (diff === 0) tc++;
    });
    return { pending: p, done: d, overdueCount: od, todayCount: tc };
  }, [todos]);

  const handleAdd = () => {
    if (!text.trim()) return;
    onAdd({ text: text.trim(), due: due || null });
    setText(''); setDue('');
  };

  return (
    <div className="flex flex-col gap-3">
      {(overdueCount > 0 || todayCount > 0) && (
        <div className="flex items-center gap-2 rounded-lg border border-[#F0654A]/25 bg-[#F0654A0D] px-3 py-2 text-[12px] text-[#F0654A]">
          <BellIcon size={13} />
          {overdueCount > 0 && <span>지난 항목 {overdueCount}건</span>}
          {overdueCount > 0 && todayCount > 0 && <span>·</span>}
          {todayCount > 0 && <span>오늘 마감 {todayCount}건</span>}
        </div>
      )}

      <div className="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-3 flex items-center gap-2">
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAdd()}
          placeholder="할 일 입력…" className="flex-1 min-w-0 px-2 py-1.5 text-[13px] bg-transparent text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500" />
        <input type="date" value={due} onChange={e => setDue(e.target.value)}
          className="w-[118px] shrink-0 px-2 py-1.5 rounded-md text-[12px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300" />
        <button onClick={handleAdd} disabled={!text.trim()}
          className="shrink-0 p-2 rounded-lg bg-[#45C4B0] text-[#1a1206] active:scale-90 disabled:opacity-40 disabled:active:scale-100 transition-all">
          <Plus size={15} strokeWidth={2.5} />
        </button>
      </div>

      {pending.length === 0 ? (
        <div className="text-center py-10 text-slate-400 dark:text-slate-500 text-[13px]">할 일이 모두 처리됐습니다.</div>
      ) : (
        <div className="space-y-1.5">
          {pending.map(t => {
            const diff = daysUntil(t.due);
            let badge = null;
            if (t.due) {
              if (diff < 0) badge = { txt: `${-diff}일 지남`, cls: 'text-[#F0654A] bg-[#F0654A]/10' };
              else if (diff === 0) badge = { txt: '오늘', cls: 'text-[#E8A93B] bg-[#E8A93B]/10' };
              else badge = { txt: `D-${diff}`, cls: 'text-slate-400 bg-slate-100 dark:bg-slate-800' };
            }
            return (
              <div key={t.id} className={`flex items-center gap-2.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 px-3 py-2.5 hover:border-slate-300 dark:hover:border-slate-700 transition-colors ${completingId === t.id ? 'wj-item-leaving' : ''}`}>
                <button onClick={() => handleToggleAnimated(t)} disabled={completingId === t.id}
                  className={`shrink-0 transition-all active:scale-90 ${completingId === t.id ? 'text-emerald-500 wj-check-bounce' : 'text-slate-300 dark:text-slate-600 hover:text-[#45C4B0]'}`}>
                  {completingId === t.id ? <CircleCheckBig size={18} /> : <CircleIcon size={18} />}
                </button>
                <span className="flex-1 min-w-0 text-[13.5px] text-slate-700 dark:text-slate-200 break-words">{t.text}</span>
                {badge && <span className={`text-[10.5px] font-mono px-1.5 py-0.5 rounded shrink-0 ${badge.cls}`}>{badge.txt}</span>}
                {t.due && (
                  <button onClick={() => downloadICS(t.text, t.due)} title="캘린더에 추가" className="p-1 text-slate-300 dark:text-slate-600 hover:text-[#5B9DF9] active:scale-90 transition-all shrink-0">
                    <CalendarPlus size={14} />
                  </button>
                )}
                <button onClick={() => onDelete(t)} className="p-1 text-slate-300 dark:text-slate-600 hover:text-red-500 active:scale-90 transition-all shrink-0">
                  <X size={13} />
                </button>
              </div>
            );
          })}
        </div>
      )}

      {done.length > 0 && (
        <div className="pt-1">
          <button onClick={() => setShowDone(v => !v)} className="text-[11.5px] text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 flex items-center gap-1">
            <ChevronDown size={12} className={showDone ? 'rotate-180 transition-transform' : 'transition-transform'} /> 완료 {done.length}건
          </button>
          {showDone && (
            <div className="space-y-1.5 mt-2">
              {done.map(t => (
                <div key={t.id} className="flex items-center gap-2.5 rounded-lg border border-slate-100 dark:border-slate-800/60 px-3 py-2 opacity-60">
                  <button onClick={() => onToggle(t)} className="text-emerald-500 shrink-0"><CircleCheckBig size={16} /></button>
                  <span className="flex-1 min-w-0 text-[13px] text-slate-500 dark:text-slate-400 line-through break-words">{t.text}</span>
                  <button onClick={() => onDelete(t)} className="p-1 text-slate-300 dark:text-slate-600 hover:text-red-500 active:scale-90 transition-all shrink-0"><X size={13} /></button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function SummaryPanel({ entries }) {
  const [range, setRange] = useState('week');
  const stats = useMemo(() => {
    const now = new Date();
    let start;
    if (range === 'week') {
      const day = now.getDay();
      const diffToMonday = (day === 0 ? -6 : 1) - day;
      start = new Date(now); start.setDate(now.getDate() + diffToMonday); start.setHours(0, 0, 0, 0);
    } else {
      start = new Date(now.getFullYear(), now.getMonth(), 1);
    }
    const pad = n => String(n).padStart(2, '0');
    const startStr = `${start.getFullYear()}-${pad(start.getMonth() + 1)}-${pad(start.getDate())}`;
    const inRange = entries.filter(e => (e.date || '') >= startStr);
    const byCategory = {};
    CATEGORIES.forEach(c => { byCategory[c.id] = 0; });
    inRange.forEach(e => { byCategory[e.category] = (byCategory[e.category] || 0) + 1; });
    return { total: inRange.length, byCategory };
  }, [entries, range]);

  const maxCat = Math.max(1, ...Object.values(stats.byCategory));

  return (
    <div className="wj-enter rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4">
      <div className="flex items-center justify-between mb-3">
        <div className="text-[13px] font-semibold text-slate-700 dark:text-slate-200">{range === 'week' ? '이번 주' : '이번 달'} 요약</div>
        <div className="flex items-center gap-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 p-0.5">
          <button onClick={() => setRange('week')}
            className={`px-2.5 py-1 rounded-md text-[11.5px] font-medium transition-colors ${range === 'week' ? 'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 shadow-sm' : 'text-slate-400 dark:text-slate-500'}`}>주간</button>
          <button onClick={() => setRange('month')}
            className={`px-2.5 py-1 rounded-md text-[11.5px] font-medium transition-colors ${range === 'month' ? 'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 shadow-sm' : 'text-slate-400 dark:text-slate-500'}`}>월간</button>
        </div>
      </div>
      <div className="font-mono text-2xl font-semibold text-slate-800 dark:text-slate-100 mb-3">
        {stats.total}<span className="text-[12px] font-sans font-normal text-slate-400 dark:text-slate-500 ml-1">건 작성</span>
      </div>
      <div className="space-y-1.5">
        {CATEGORIES.map(c => (
          <div key={c.id} className="flex items-center gap-2">
            <span className="text-[11px] w-16 shrink-0 text-slate-500 dark:text-slate-400">{c.label}</span>
            <div className="flex-1 h-1.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
              <div className="h-full rounded-full transition-all" style={{ width: `${(stats.byCategory[c.id] / maxCat) * 100}%`, background: c.color }} />
            </div>
            <span className="text-[11px] font-mono text-slate-400 dark:text-slate-500 w-4 text-right">{stats.byCategory[c.id]}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function MonthCalendar({ year, month, entriesByDay, notesByDay, selectedDay, onSelectDay }) {
  const weeks = useMemo(() => buildCalendarWeeks(year, month), [year, month]);

          <div key={d} className={`text-center text-[10.5px] font-medium py-1 ${i === 0 ? 'text-[#F0654A]/70' : i === 6 ? 'text-[#5B9DF9]/70' : 'text-slate-400 dark:text-slate-500'}`}>{d}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-y-1">
        {weeks.flat().map((cell, i) => {
          const key = dateKeyFromDate(cell.date);
          const dayEntries = entriesByDay[key] || [];
          const dayNotes = notesByDay[key] || [];
          const hasAny = dayEntries.length > 0 || dayNotes.length > 0;
          const isToday = key === todayKey;
          const isSelected = key === selectedDay;
          return (
            <button key={i} onClick={() => onSelectDay(key)}
              className={`aspect-square flex flex-col items-center justify-center gap-0.5 rounded-lg text-[12px] transition-all active:scale-90 ${
                !cell.inMonth ? 'text-slate-300 dark:text-slate-700' : 'text-slate-600 dark:text-slate-300'
              } ${isSelected ? 'bg-[#45C4B0] text-[#1a1206] font-semibold' : isToday ? 'bg-[#45C4B0]/10 font-semibold' : hasAny ? 'hover:bg-slate-100 dark:hover:bg-slate-800' : 'hover:bg-slate-50 dark:hover:bg-slate-800/50'}`}>
              <span>{cell.date.getDate()}</span>
              <span className="flex items-center gap-0.5 h-1.5">
                {dayEntries.length > 0 && <span className={`w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-[#1a1206]' : ''}`} style={!isSelected ? { background: '#45C4B0' } : undefined} />}
                {dayNotes.length > 0 && <span className={`w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-[#1a1206]/50' : 'bg-slate-400 dark:bg-slate-500'}`} />}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// 날짜를 누르면 뜨는 바텀시트 — 그날의 일지 + 빠른 기록을 따로 보여줌 (읽기 위주, 일지는 눌러서 수정 가능)
function DayDetailSheet({ open, dateKey, cfg, dayEntries, dayNotes, onClose, onEditEntry }) {
  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape' && open) onClose(); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  if (!open) return null;
  const isEmpty = dayEntries.length === 0 && dayNotes.length === 0;

  return (
    <div className="fixed inset-0 z-[65] flex items-end justify-center" onClick={onClose}>
      <div className="absolute inset-0 bg-black/40 wj-modal-pop" />
      <div onClick={e => e.stopPropagation()}
        className="wj-sheet-up relative w-full max-w-2xl lg:max-w-3xl xl:max-w-4xl max-h-[80vh] overflow-y-auto rounded-t-2xl bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shadow-2xl"
        style={{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 1rem)' }}>
        <div className="sticky top-0 bg-white dark:bg-slate-900 flex items-center justify-between px-4 sm:px-6 py-3.5 border-b border-slate-100 dark:border-slate-800">

            <Calendar size={15} className="text-[#45C4B0]" /> {dateKey ? fmtDateShort(dateKey) : ''}

          <button onClick={onClose} className="p-1.5 rounded-md text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all"><X size={16} /></button>

        <div className="px-4 sm:px-6 py-4 space-y-4">

                <div>
                  <div className="text-[11px] font-semibold text-slate-400 dark:text-slate-500 mb-2 flex items-center gap-1"><FolderKanban size={11} /> 업무일지 {dayEntries.length}건</div>

                          <div className="flex items-center gap-2 flex-wrap mb-1">

                          </div>

    });
    return map;

  const projects = useMemo(() => [...new Set(entries.map(e => e.title).filter(Boolean))].sort(), [entries]);

  const filtered = useMemo(() => {

    return entries
      .filter(e => !projectFilter || e.title === projectFilter)

      .filter(e => !favoriteOnly || e.favorite)

        if (!q) return true;
        const hay = [e.title, e.problem, e.solution, e.lesson, ...(e.bullets || []), ...(e.tags || [])].join(' ').toLowerCase();
        return hay.includes(q);

          </div>

      <DayDetailSheet

        dayEntries={selectedDay ? (entriesByDay[selectedDay] || []) : []}

  );
