function uid() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function todayStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function fmtDateShort(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${days[d.getDay()]})`;
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(todayStr() + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function downloadICS(title, dateStr) {
  if (!dateStr) return;
  const dt = dateStr.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const esc = s => String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//WorkJournal//KO', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid()}@workjournal`,
    `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${dt}`,
    `DTEND;VALUE=DATE:${dt}`,
    `SUMMARY:${esc(title)}`,
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(title || '할일').slice(0, 40)}.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

=========================================================== */
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64.replace(/\n/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

async function ghFetch(cfg, path, opts = {}) {
  const url = `${GH_API}/repos/${cfg.owner}/${cfg.repo}/contents/${path}${opts.query || ''}`;
  return fetch(url, {
    method: opts.method || 'GET',
    headers: {
      Authorization: `Bearer ${cfg.token}`,
      Accept: opts.accept || 'application/vnd.github+json',
      ...(opts.method === 'PUT' ? { 'Content-Type': 'application/json' } : {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
}

async function ghGetJSON(cfg, path) {
  const res = await ghFetch(cfg, path, { query: `?ref=${cfg.branch || 'main'}` });
  if (res.status === 404) return { data: [], sha: null };
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `GitHub 읽기 실패 (${res.status})`);
  }
  const json = await res.json();
  let data = [];
  try { data = JSON.parse(base64ToUtf8(json.content)); } catch (e) { data = []; }
  return { data: Array.isArray(data) ? data : [], sha: json.sha };
}

async function ghPutJSON(cfg, path, dataArr, sha, message) {
  const body = {
    message: message || `update ${path}`,
    content: utf8ToBase64(JSON.stringify(dataArr, null, 2)),
    branch: cfg.branch || 'main',
  };
  if (sha) body.sha = sha;
  const res = await ghFetch(cfg, path, { method: 'PUT', body });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub 저장 실패 (${res.status})`);
  }
  const json = await res.json();
  return json.content.sha;
}

async function ghPutImage(cfg, path, base64Content, message) {
  const body = { message: message || `add ${path}`, content: base64Content, branch: cfg.branch || 'main' };
  const res = await ghFetch(cfg, path, { method: 'PUT', body });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `이미지 업로드 실패 (${res.status})`);
  }
  return path;
}

async function ghGetImageBlobUrl(cfg, path) {
  const res = await ghFetch(cfg, path, { query: `?ref=${cfg.branch || 'main'}`, accept: 'application/vnd.github.raw+json' });
  if (!res.ok) throw new Error('이미지 로드 실패');
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

  if (res.status === 401) throw new Error('토큰이 올바르지 않거나 만료되었습니다.');
  if (res.status === 404) throw new Error('레포지토리를 찾을 수 없습니다. 계정명·레포 이름을 확인해주세요. (레포가 완전히 비어있으면 404가 뜰 수 있어요 — README와 함께 생성했는지 확인)');
  if (res.status === 403) throw new Error('접근이 거부되었습니다. 토큰 권한(Contents: Read and write)을 확인해주세요.');
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `연결 실패 (${res.status})`);
  }
  return true;
}

function compressImage(file, maxSize = 1600, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
    reader.onload = e => {
      const img = new window.Image();
      img.onerror = () => reject(new Error('이미지를 처리하지 못했습니다.'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          if (width > height) { height = Math.round(height * maxSize / width); width = maxSize; }
          else { width = Math.round(width * maxSize / height); height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl.split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
    reader.onload = e => resolve(e.target.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
}

function extFromFile(file) {
  const byType = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/heic': 'heic', 'image/heif': 'heif', 'image/gif': 'gif' };
  if (byType[file.type]) return byType[file.type];
  const parts = (file.name || '').split('.');
  return parts.length > 1 ? parts.pop().toLowerCase() : 'jpg';
}

/* 이미지 참조 형식 호환 — 예전 데이터는 문자열 경로 하나, 새 데이터는 {thumb, original} 객체 */
function imgPaths(ref) {
  if (typeof ref === 'string') return { thumb: ref, original: ref };
  return { thumb: ref.thumb, original: ref.original || ref.thumb };
}

/* ===========================================================
   GitHub 이미지 캐시 훅
=========================================================== */
const imageUrlCache = new Map();
function useGhImage(cfg, path) {
  const [url, setUrl] = useState(() => imageUrlCache.get(path) || null);
  useEffect(() => {
    let cancelled = false;
    if (!path || !cfg) return;
    if (imageUrlCache.has(path)) { setUrl(imageUrlCache.get(path)); return; }
    ghGetImageBlobUrl(cfg, path).then(u => {
      if (!cancelled) { imageUrlCache.set(path, u); setUrl(u); }
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [path, cfg]);
  return url;
}
function GhImage({ cfg, path, originalPath, className }) {
  const url = useGhImage(cfg, path);
  if (!url) return <div className={`bg-slate-200 dark:bg-slate-800 animate-pulse ${className}`} />;
  return (
    <img src={url} className={`${className} cursor-zoom-in`}
      onClick={() => window.dispatchEvent(new CustomEvent('wj-lightbox-open', { detail: { cfg, path: originalPath || path } }))} />
  );
}

function GlobalLightbox() {
  const [state, setState] = useState(null);
  const [url, setUrl] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    const handler = e => { setState(e.detail); setUrl(null); setError(''); };
    window.addEventListener('wj-lightbox-open', handler);
    return () => window.removeEventListener('wj-lightbox-open', handler);
  }, []);

  useEffect(() => {
    if (!state) return;
    let cancelled = false;
    setLoading(true);
    ghGetImageBlobUrl(state.cfg, state.path)
      .then(u => { if (!cancelled) { setUrl(u); setLoading(false); } })
      .catch(() => { if (!cancelled) { setError('원본을 불러오지 못했습니다.'); setLoading(false); } });
    return () => { cancelled = true; };
  }, [state]);

  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') setState(null); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  if (!state) return null;

  const handleDownload = () => {
    if (!url) return;
    const a = document.createElement('a');
    a.href = url;
    a.download = state.path.split('/').pop();
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  return (
    <div className="fixed inset-0 z-[80] flex flex-col items-center justify-center bg-black/90 p-4 wj-modal-pop gap-3" onClick={() => setState(null)}>
      <button onClick={() => setState(null)} className="absolute top-4 right-4 p-2 rounded-full bg-white/10 text-white hover:bg-white/20 active:scale-90 transition-all">
        <X size={20} />
      </button>
      {loading && <LoaderCircle size={26} className="text-white/70 wj-spin" />}
      {error && <p className="text-white/80 text-[13px]">{error}</p>}
      {url && (
        <React.Fragment>
          <img src={url} className="max-w-full max-h-[78vh] object-contain rounded-lg" onClick={e => e.stopPropagation()} />
          <button onClick={e => { e.stopPropagation(); handleDownload(); }}
            className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-white/10 text-white text-[13px] font-medium hover:bg-white/20 active:scale-95 transition-all">
            <Download size={14} /> 원본 다운로드
          </button>
        </React.Fragment>
      )}
    </div>
  );
}

                  <button type="button" onClick={() => removeNew(i)} className="absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-black/70 text-white flex items-center justify-center active:scale-90 transition-transform"><X size={10} /></button>
                </div>
              ))}
            </div>
          )}
          <div>
            <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={totalImages >= 4}
              className="inline-flex items-center gap-1.5 text-[12px] font-medium px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 active:scale-95 transition-all">
              <Camera size={13} /> 사진 추가 {totalImages > 0 && `(${totalImages}/4)`}
            </button>
            <input ref={fileInputRef} type="file" accept="image/*" multiple className="hidden" onChange={handleFiles} />
          </div>
        </div>
        <div className="flex items-center justify-end gap-2 px-5 py-4 border-t border-slate-200 dark:border-slate-800 shrink-0">
          <button type="button" onClick={onClose} className="px-3.5 py-2 rounded-lg text-[13px] font-medium text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">취소</button>
          <button type="submit" disabled={saving}
            className="px-4 py-2 rounded-lg text-[13px] font-semibold bg-[#45C4B0] text-[#1a1206] hover:brightness-105 active:scale-[0.97] disabled:opacity-40 transition-all inline-flex items-center gap-1.5">
            {saving && <LoaderCircle size={13} className="wj-spin" />} 수정 저장
          </button>
        </div>
      </form>
    </div>
  );
}

function QuickCaptureTab({ cfg, notes, phrases, onAdd, onDelete, onRestore, onPermanentDelete, onEditSave, onPromote, uploading, savingEdit }) {
  const [text, setText] = useState('');
  const [files, setFiles] = useState([]);
  const [showTrash, setShowTrash] = useState(false);
  const [editingNote, setEditingNote] = useState(null);
  const fileInputRef = useRef(null);

  const handleFiles = e => {
    const list = Array.from(e.target.files || []);
    setFiles(prev => [...prev, ...list].slice(0, 4));
    e.target.value = '';
  };
  const removeFile = idx => setFiles(prev => prev.filter((_, i) => i !== idx));

  const handleSend = () => {
    if (!text.trim() && files.length === 0) return;
    onAdd(text.trim(), files);
    setText(''); setFiles([]);
  };
  const insertPhrase = t => setText(prev => {
    if (!prev) return t;
    const sep = /[\n ]$/.test(prev) ? '' : ' ';
    return prev + sep + t;
  });

  const active = useMemo(() => notes.filter(n => !n.deleted).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)), [notes]);
  const trashed = useMemo(() => notes.filter(n => n.deleted).sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0)), [notes]);

  const handleEditSave = (note, newText, keepImages, newFiles) => {
    onEditSave(note, newText, keepImages, newFiles);
    setEditingNote(null);
  };

  return (
    <div className="flex flex-col gap-3">
      <div className="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-3 shadow-sm focus-within:border-[#45C4B0]/50 focus-within:ring-2 focus-within:ring-[#45C4B0]/12 transition-all">
        {phrases && phrases.length > 0 && (
          <div className="flex items-center gap-1.5 overflow-x-auto pb-2 mb-1 -mx-1 px-1" style={{ scrollbarWidth: 'none' }}>
            {phrases.map(p => (
              <button key={p.id} type="button" onClick={() => insertPhrase(p.text)}
                className="shrink-0 inline-flex items-center gap-1 text-[11.5px] px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all whitespace-nowrap">
                <Quote size={10} /> {p.text}
              </button>
            ))}
          </div>
        )}
        <textarea
          value={text}
          onChange={e => setText(e.target.value)}
          placeholder="보고 들은 걸 바로 적어두세요…"
          rows={2}
          className="w-full px-1 py-1 text-[13.5px] bg-transparent text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500 resize-none"
        />
        {files.length > 0 && (
          <div className="flex items-center gap-2 flex-wrap mt-1 mb-2 px-1">
            {files.map((f, i) => (
              <div key={i} className="relative w-14 h-14 rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700 shadow-sm">
                <img src={URL.createObjectURL(f)} className="w-full h-full object-cover" />
                <button onClick={() => removeFile(i)} className="absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-black/70 text-white flex items-center justify-center active:scale-90 transition-transform">
                  <X size={10} />
                </button>
              </div>
            ))}
          </div>
        )}
        <div className="flex items-center justify-between pt-1.5 border-t border-slate-100 dark:border-slate-800">
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()}
            className="p-1.5 rounded-lg text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all">
            <Camera size={17} />
          </button>
          <input ref={fileInputRef} type="file" accept="image/*" multiple className="hidden" onChange={handleFiles} />
          <button onClick={handleSend} disabled={uploading || (!text.trim() && files.length === 0)}
            className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-[12.5px] font-semibold bg-[#45C4B0] text-[#1a1206] hover:brightness-105 active:scale-[0.97] disabled:opacity-40 disabled:active:scale-100 transition-all">
            {uploading ? <LoaderCircle size={13} className="wj-spin" /> : <Send size={13} />}
            {uploading ? '저장 중…' : '기록'}
          </button>
        </div>
      </div>

      {(active.length > 0 || trashed.length > 0) && (
        <div className="flex items-center justify-between px-0.5">
          <span className="text-[11.5px] text-slate-400 dark:text-slate-500 font-mono">
            {showTrash ? `휴지통 ${trashed.length}건` : `${active.length}건`}
          </span>
          <button onClick={() => setShowTrash(v => !v)}
            className="text-[11.5px] font-medium text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 inline-flex items-center gap-1">
            <TrashIcon size={11} /> {showTrash ? '목록으로' : `휴지통${trashed.length > 0 ? ` (${trashed.length})` : ''}`}
          </button>
        </div>
      )}

      {showTrash ? (
        trashed.length === 0 ? (
          <div className="text-center py-14 text-slate-400 dark:text-slate-500 text-[13px]">휴지통이 비어 있습니다.</div>
        ) : (
          <div className="space-y-2.5">
            {trashed.map(note => (
              <div key={note.id} className="wj-enter rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/40 p-3.5 opacity-80">
                <div className="flex items-start justify-between gap-2">
                  <span className="text-[10.5px] font-mono text-slate-400 dark:text-slate-500">삭제됨 · {fmtDateShort((note.deletedAt ? new Date(note.deletedAt) : new Date()).toISOString().slice(0, 10))}</span>
                  <div className="flex items-center gap-1">
                    <button onClick={() => onRestore(note)} title="복원" className="p-1 rounded text-slate-400 dark:text-slate-500 hover:text-[#45C4B0] active:scale-90 transition-all"><Undo2 size={13} /></button>
                    <button onClick={() => onPermanentDelete(note)} title="영구 삭제" className="p-1 rounded text-slate-400 dark:text-slate-500 hover:text-red-500 active:scale-90 transition-all"><Trash2 size={13} /></button>
                  </div>
                </div>
                {note.text && <p className="text-[13px] text-slate-500 dark:text-slate-400 leading-relaxed mt-1.5 line-clamp-2 break-words">{note.text}</p>}
              </div>
            ))}
          </div>
        )
      ) : active.length === 0 ? (
        <div className="text-center py-14 text-slate-400 dark:text-slate-500 text-[13px]">
          아직 빠른 기록이 없습니다. 위에서 바로 적어보세요.
        </div>
      ) : (
        <div className="space-y-2.5">
          {active.map(note => (
            <div key={note.id} className="wj-enter rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-3.5 hover:border-slate-300 dark:hover:border-slate-700 transition-colors">
              <div className="flex items-start justify-between gap-2">
                <span className="text-[10.5px] font-mono text-slate-400 dark:text-slate-500">
                  {fmtDateShort((note.createdAt ? new Date(note.createdAt) : new Date()).toISOString().slice(0, 10))} {fmtTime(note.createdAt)}
                </span>
                <div className="flex items-center gap-1">
                  <button onClick={() => setEditingNote(note)} title="수정" className="p-1 rounded text-slate-300 dark:text-slate-600 hover:text-slate-600 dark:hover:text-slate-300 active:scale-90 transition-all">
                    <Pencil size={13} />
                  </button>
                  <button onClick={() => onDelete(note)} title="삭제" className="p-1 rounded text-slate-300 dark:text-slate-600 hover:text-red-500 active:scale-90 transition-all">
                    <Trash2 size={13} />
                  </button>
                </div>
              </div>
              {note.text && <p className="text-[13.5px] text-slate-700 dark:text-slate-200 leading-relaxed mt-1.5 whitespace-pre-wrap break-words">{note.text}</p>}
              {note.imageRefs && note.imageRefs.length > 0 && (
                <div className="flex items-center gap-2 flex-wrap mt-2.5">
                  {note.imageRefs.map((ref, i) => {
                    const { thumb, original } = imgPaths(ref);
                    return <GhImage key={thumb + i} cfg={cfg} path={thumb} originalPath={original} className="w-16 h-16 rounded-md object-cover border border-slate-200 dark:border-slate-700" />;
                  })}
                </div>
              )}
              <div className="flex items-center justify-between mt-2.5 pt-2.5 border-t border-slate-100 dark:border-slate-800">
                {note.processed ? (
                  <span className="inline-flex items-center gap-1 text-[11px] text-emerald-500 font-medium">
                    <CircleCheckBig size={12} /> 일지로 정리됨
                  </span>
                ) : (
                  <button onClick={() => onPromote(note)}
                    className="inline-flex items-center gap-1 text-[11.5px] font-medium text-[#45C4B0] hover:underline">
                    일지로 정리하기 <ArrowRight size={12} />
                  </button>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      <NoteEditModal open={!!editingNote} note={editingNote} cfg={cfg} onClose={() => setEditingNote(null)} onSave={handleEditSave} saving={savingEdit} />
    </div>
  );
}

/* ===========================================================
   할 일 탭

function TodoTab({ todos, onAdd, onToggle, onDelete }) {
  const [text, setText] = useState('');
  const [due, setDue] = useState('');
  const [showDone, setShowDone] = useState(false);

  const { pending, done, overdueCount, todayCount } = useMemo(() => {
    const p = todos.filter(t => !t.done).sort((a, b) => (a.due || '9999-99-99').localeCompare(b.due || '9999-99-99'));
    const d = todos.filter(t => t.done).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    let od = 0, tc = 0;
    p.forEach(t => {
      if (!t.due) return;
      const diff = daysUntil(t.due);
      if (diff < 0) od++; else if (diff === 0) tc++;
    });
    return { pending: p, done: d, overdueCount: od, todayCount: tc };
  }, [todos]);

  const handleAdd = () => {
    if (!text.trim()) return;
    onAdd({ text: text.trim(), due: due || null });
    setText(''); setDue('');
  };

  return (
    <div className="flex flex-col gap-3">
      {(overdueCount > 0 || todayCount > 0) && (
        <div className="flex items-center gap-2 rounded-lg border border-[#F0654A]/25 bg-[#F0654A0D] px-3 py-2 text-[12px] text-[#F0654A]">
          <BellIcon size={13} />
          {overdueCount > 0 && <span>지난 항목 {overdueCount}건</span>}
          {overdueCount > 0 && todayCount > 0 && <span>·</span>}
          {todayCount > 0 && <span>오늘 마감 {todayCount}건</span>}
        </div>
      )}

      <div className="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-3 flex items-center gap-2">
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAdd()}
          placeholder="할 일 입력…" className="flex-1 min-w-0 px-2 py-1.5 text-[13px] bg-transparent text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500" />
        <input type="date" value={due} onChange={e => setDue(e.target.value)}
          className="w-[118px] shrink-0 px-2 py-1.5 rounded-md text-[12px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300" />
        <button onClick={handleAdd} disabled={!text.trim()}
          className="shrink-0 p-2 rounded-lg bg-[#45C4B0] text-[#1a1206] active:scale-90 disabled:opacity-40 disabled:active:scale-100 transition-all">
          <Plus size={15} strokeWidth={2.5} />
        </button>
      </div>

      {pending.length === 0 ? (
        <div className="text-center py-10 text-slate-400 dark:text-slate-500 text-[13px]">할 일이 모두 처리됐습니다.</div>
      ) : (
        <div className="space-y-1.5">
          {pending.map(t => {
            const diff = daysUntil(t.due);
            let badge = null;
            if (t.due) {
              if (diff < 0) badge = { txt: `${-diff}일 지남`, cls: 'text-[#F0654A] bg-[#F0654A]/10' };
              else if (diff === 0) badge = { txt: '오늘', cls: 'text-[#E8A93B] bg-[#E8A93B]/10' };
              else badge = { txt: `D-${diff}`, cls: 'text-slate-400 bg-slate-100 dark:bg-slate-800' };
            }
            return (
              <div key={t.id} className="flex items-center gap-2.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 px-3 py-2.5 hover:border-slate-300 dark:hover:border-slate-700 transition-colors">
                <button onClick={() => onToggle(t)} className="text-slate-300 dark:text-slate-600 hover:text-[#45C4B0] active:scale-90 transition-all shrink-0">
                  <CircleIcon size={18} />
                </button>
                <span className="flex-1 min-w-0 text-[13.5px] text-slate-700 dark:text-slate-200 break-words">{t.text}</span>
                {badge && <span className={`text-[10.5px] font-mono px-1.5 py-0.5 rounded shrink-0 ${badge.cls}`}>{badge.txt}</span>}
                {t.due && (
                  <button onClick={() => downloadICS(t.text, t.due)} title="캘린더에 추가" className="p-1 text-slate-300 dark:text-slate-600 hover:text-[#5B9DF9] active:scale-90 transition-all shrink-0">
                    <CalendarPlus size={14} />
                  </button>
                )}
                <button onClick={() => onDelete(t)} className="p-1 text-slate-300 dark:text-slate-600 hover:text-red-500 active:scale-90 transition-all shrink-0">
                  <X size={13} />
                </button>
              </div>
            );
          })}
        </div>
      )}

      {done.length > 0 && (
        <div className="pt-1">
          <button onClick={() => setShowDone(v => !v)} className="text-[11.5px] text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 flex items-center gap-1">
            <ChevronDown size={12} className={showDone ? 'rotate-180 transition-transform' : 'transition-transform'} /> 완료 {done.length}건
          </button>
          {showDone && (
            <div className="space-y-1.5 mt-2">
              {done.map(t => (
                <div key={t.id} className="flex items-center gap-2.5 rounded-lg border border-slate-100 dark:border-slate-800/60 px-3 py-2 opacity-60">
                  <button onClick={() => onToggle(t)} className="text-emerald-500 shrink-0"><CircleCheckBig size={16} /></button>
                  <span className="flex-1 min-w-0 text-[13px] text-slate-500 dark:text-slate-400 line-through break-words">{t.text}</span>
                  <button onClick={() => onDelete(t)} className="p-1 text-slate-300 dark:text-slate-600 hover:text-red-500 active:scale-90 transition-all shrink-0"><X size={13} /></button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function StatsStrip({ entries }) {
  const stats = useMemo(() => {
    const now = new Date();
    const key = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    return [
      { label: '전체 기록', value: entries.length, icon: FolderKanban, color: '#8B93A1' },
      { label: '이번 달', value: entries.filter(e => (e.date || '').startsWith(key)).length, icon: Calendar, color: '#5B9DF9' },
      { label: '중요도 상', value: entries.filter(e => e.importance === '상').length, icon: AlertTriangle, color: '#F0654A' },
      { label: '트러블슈팅', value: entries.filter(e => e.category === '트러블슈팅').length, icon: Wrench, color: '#F0654A' },
    ];
  }, [entries]);
  return (
    <div className="flex items-stretch rounded-xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40 overflow-hidden">
      {stats.map((s, i) => (
        <div key={s.label} className={`flex-1 px-3.5 py-3 ${i !== 0 ? 'border-l border-slate-200 dark:border-slate-800' : ''}`}>
          <s.icon size={12} strokeWidth={2.2} style={{ color: s.color }} className="mb-1.5 opacity-80" />
          <div className="font-mono text-xl font-semibold text-slate-800 dark:text-slate-100 tabular-nums leading-none">{s.value}</div>
          <div className="text-[10.5px] text-slate-400 dark:text-slate-500 mt-1.5">{s.label}</div>
        </div>
      ))}
    </div>
  );
}

}

                  <div className="text-[10.5px] font-semibold text-slate-400 dark:text-slate-500 mb-1">해결 과정</div>
                  <p className={`text-[12.5px] text-slate-600 dark:text-slate-300 leading-relaxed ${!expanded ? 'line-clamp-2' : ''}`}>{entry.solution}</p>

        )}

        {entry.lesson && (

        {entry.images && entry.images.length > 0 && (
          <div className="flex items-center gap-2 flex-wrap mt-3">
            {entry.images.map((ref, i) => {

            })}

        {entry.links && entry.links.length > 0 && (
          <div className="mt-3 flex flex-col gap-1">

                <Link2 size={11} className="shrink-0" /> {l.label || l.url}

        {entry.tags && entry.tags.length > 0 && (

        )}
      </div>
    </div>
  );
}

        date: initial.date || todayStr(), title: initial.title || '', category: initial.category || '개발',

function SummaryPanel({ entries }) {
  const [range, setRange] = useState('week');
  const stats = useMemo(() => {
    const now = new Date();
    let start;
    if (range === 'week') {
      const day = now.getDay();
      const diffToMonday = (day === 0 ? -6 : 1) - day;
      start = new Date(now); start.setDate(now.getDate() + diffToMonday); start.setHours(0, 0, 0, 0);
    } else {
      start = new Date(now.getFullYear(), now.getMonth(), 1);
    }
    const pad = n => String(n).padStart(2, '0');
    const startStr = `${start.getFullYear()}-${pad(start.getMonth() + 1)}-${pad(start.getDate())}`;
    const inRange = entries.filter(e => (e.date || '') >= startStr);
    const byCategory = {};
    CATEGORIES.forEach(c => { byCategory[c.id] = 0; });
    inRange.forEach(e => { byCategory[e.category] = (byCategory[e.category] || 0) + 1; });
    return { total: inRange.length, byCategory };
  }, [entries, range]);

  const maxCat = Math.max(1, ...Object.values(stats.byCategory));

  return (
    <div className="wj-enter rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4">
      <div className="flex items-center justify-between mb-3">
        <div className="text-[13px] font-semibold text-slate-700 dark:text-slate-200">{range === 'week' ? '이번 주' : '이번 달'} 요약</div>
        <div className="flex items-center gap-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 p-0.5">
          <button onClick={() => setRange('week')}
            className={`px-2.5 py-1 rounded-md text-[11.5px] font-medium transition-colors ${range === 'week' ? 'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 shadow-sm' : 'text-slate-400 dark:text-slate-500'}`}>주간</button>
          <button onClick={() => setRange('month')}
            className={`px-2.5 py-1 rounded-md text-[11.5px] font-medium transition-colors ${range === 'month' ? 'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 shadow-sm' : 'text-slate-400 dark:text-slate-500'}`}>월간</button>
        </div>
      </div>
      <div className="font-mono text-2xl font-semibold text-slate-800 dark:text-slate-100 mb-3">
        {stats.total}<span className="text-[12px] font-sans font-normal text-slate-400 dark:text-slate-500 ml-1">건 작성</span>
      </div>
      <div className="space-y-1.5">
        {CATEGORIES.map(c => (
          <div key={c.id} className="flex items-center gap-2">
            <span className="text-[11px] w-16 shrink-0 text-slate-500 dark:text-slate-400">{c.label}</span>
            <div className="flex-1 h-1.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
              <div className="h-full rounded-full transition-all" style={{ width: `${(stats.byCategory[c.id] / maxCat) * 100}%`, background: c.color }} />
            </div>
            <span className="text-[11px] font-mono text-slate-400 dark:text-slate-500 w-4 text-right">{stats.byCategory[c.id]}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function EntriesTab({ cfg, entries, onOpenNew, onEdit, onDelete, onToggleFavorite }) {
  const [query, setQuery] = useState('');
  const [projectFilter, setProjectFilter] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('');
  const [importanceFilter, setImportanceFilter] = useState('');
  const [favoriteOnly, setFavoriteOnly] = useState(false);
  const [showSummary, setShowSummary] = useState(false);

  const projects = useMemo(() => [...new Set(entries.map(e => e.title).filter(Boolean))].sort(), [entries]);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return entries
      .filter(e => !projectFilter || e.title === projectFilter)
      .filter(e => !categoryFilter || e.category === categoryFilter)
      .filter(e => !importanceFilter || e.importance === importanceFilter)
      .filter(e => !favoriteOnly || e.favorite)
      .filter(e => {
        if (!q) return true;
        const hay = [e.title, e.problem, e.solution, e.lesson, ...(e.bullets || []), ...(e.tags || [])].join(' ').toLowerCase();
        return hay.includes(q);
      })
      .sort((a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0) || (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
  }, [entries, query, projectFilter, categoryFilter, importanceFilter, favoriteOnly]);

  const hasFilters = !!(query || projectFilter || categoryFilter || importanceFilter || favoriteOnly);
  const resetFilters = () => { setQuery(''); setProjectFilter(''); setCategoryFilter(''); setImportanceFilter(''); setFavoriteOnly(false); };

  return (
    <div className="flex flex-col gap-4">
      <StatsStrip entries={entries} />

        <div className="flex items-center justify-between px-0.5 -mt-1">
          <span className="text-[11.5px] text-slate-400 dark:text-slate-500 font-mono">{filtered.length}건 표시 중 {hasFilters && `(전체 ${entries.length}건)`}</span>
          {hasFilters && <button onClick={resetFilters} className="text-[11.5px] text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 flex items-center gap-1"><X size={11} /> 필터 초기화</button>}
        </div>
      )}

      {filtered.length === 0 ? (
        <div className="wj-enter flex flex-col items-center justify-center text-center py-20 px-6 rounded-xl border border-dashed border-slate-300 dark:border-slate-700/70">
          <div className="w-11 h-11 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800/70 mb-4">
            <Inbox size={20} className="text-slate-400 dark:text-slate-500" />
          </div>
          <p className="text-sm text-slate-600 dark:text-slate-300 font-medium">{hasFilters ? '조건에 맞는 일지가 없습니다' : '아직 작성된 업무일지가 없습니다'}</p>
          {hasFilters ? (
            <button onClick={resetFilters} className="mt-4 text-xs font-medium px-3 py-1.5 rounded-md border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">필터 초기화</button>
          ) : (
            <button onClick={onOpenNew} className="mt-4 inline-flex items-center gap-1.5 text-xs font-medium px-3.5 py-1.5 rounded-md bg-[#45C4B0] text-[#1a1206] hover:brightness-105 active:scale-[0.97] whitespace-nowrap transition-all"><Plus size={14} strokeWidth={2.5} /> 첫 일지 작성하기</button>
          )}
        </div>
      ) : (
        <div className="space-y-3">
          {filtered.map(entry => <EntryCard key={entry.id} cfg={cfg} entry={entry} onEdit={onEdit} onDelete={onDelete} onToggleFavorite={onToggleFavorite} />)}
        </div>
      )}
    </div>
  );
}

/* ===========================================================
   App 루트
=========================================================== */
function App() {
  const [cfg, setCfg] = useState(() => {
    try { const raw = localStorage.getItem(CONFIG_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  });
  const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || 'dark');
  const [tab, setTab] = useState('quick');
  const [entries, setEntries] = useState([]);
  const [entriesSha, setEntriesSha] = useState(null);
  const [quickNotes, setQuickNotes] = useState([]);
  const [quickSha, setQuickSha] = useState(null);
  const [todos, setTodos] = useState([]);
  const [todosSha, setTodosSha] = useState(null);
  const [phrases, setPhrases] = useState([]);
  const [phrasesSha, setPhrasesSha] = useState(null);
  const [loading, setLoading] = useState(false);
  const [syncError, setSyncError] = useState('');
  const [lastSynced, setLastSynced] = useState(null);
  const [toast, setToast] = useState('');
  const [uploading, setUploading] = useState(false);
  const [savingNoteEdit, setSavingNoteEdit] = useState(false);
  const [modalOpen, setModalOpen] = useState(false);
  const [editingEntry, setEditingEntry] = useState(null);
  const [prefillNote, setPrefillNote] = useState(null);
  const notifiedRef = useRef(false);

  const showToast = useCallback(msg => { setToast(msg); setTimeout(() => setToast(''), 2400); }, []);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    document.documentElement.classList.toggle('light', theme !== 'dark');
    document.body.style.background = theme === 'dark' ? '#0B0E13' : '#F7F7F9';
    localStorage.setItem(THEME_KEY, theme);
  }, [theme]);

  const loadAll = useCallback(async () => {
    if (!cfg) return;
    setLoading(true); setSyncError('');
    try {
      const [e, q, t, p] = await Promise.all([ghGetJSON(cfg, PATH_ENTRIES), ghGetJSON(cfg, PATH_QUICK_NOTES), ghGetJSON(cfg, PATH_TODOS), ghGetJSON(cfg, PATH_PHRASES)]);
      setEntries(e.data); setEntriesSha(e.sha);
      setQuickNotes(q.data); setQuickSha(q.sha);
      setTodos(t.data); setTodosSha(t.sha);
      setPhrases(p.data); setPhrasesSha(p.sha);
      setLastSynced(Date.now());
    } catch (err) {
      setSyncError(err.message || '동기화에 실패했습니다.');
    } finally {
      setLoading(false);
    }
  }, [cfg]);

  useEffect(() => { loadAll(); }, [loadAll]);

  useEffect(() => {
    if (notifiedRef.current || loading || !todos.length) return;
    const due = todos.filter(t => !t.done && t.due && daysUntil(t.due) <= 0);
    if (due.length > 0 && 'Notification' in window && Notification.permission === 'granted') {
      new Notification('업무일지', { body: `오늘 마감·지난 할 일 ${due.length}건이 있어요.` });
    }
    notifiedRef.current = true;
  }, [todos, loading]);

  const handleSaveConfig = newCfg => {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(newCfg));
    setCfg(newCfg);
  };
  const handleDisconnect = () => {
    if (!window.confirm('이 기기에서 연결 설정을 삭제할까요? GitHub의 데이터는 그대로 남습니다.')) return;
    localStorage.removeItem(CONFIG_KEY);
    setCfg(null);
    setEntries([]); setQuickNotes([]); setTodos([]);
  };

  const handleAddNote = async (text, files) => {
    setUploading(true);
    try {
      const imageRefs = [];
      for (const file of files) {
        const id = `${Date.now()}-${Math.random().toString(16).slice(2, 8)}`;
        const thumbB64 = await compressImage(file);
        const thumbPath = `images/thumb/${id}.jpg`;
        await ghPutImage(cfg, thumbPath, thumbB64, '빠른 기록 사진 추가 (목록용)');
        const origB64 = await fileToBase64(file);
        const originalPath = `images/original/${id}.${extFromFile(file)}`;
        await ghPutImage(cfg, originalPath, origB64, '빠른 기록 사진 추가 (원본)');
        imageRefs.push({ thumb: thumbPath, original: originalPath });
      }
      const newNote = { id: uid(), text, imageRefs, processed: false, linkedEntryId: null, createdAt: Date.now() };
      const newNotes = [newNote, ...quickNotes];
      const newSha = await ghPutJSON(cfg, PATH_QUICK_NOTES, newNotes, quickSha, '빠른 기록 추가');
      setQuickNotes(newNotes); setQuickSha(newSha);
      showToast('기록했습니다.');
    } catch (err) {
      showToast('저장 실패: ' + err.message);
    } finally {
      setUploading(false);
    }
  };

  const handleDeleteNote = async note => {
    try {
      const newNotes = quickNotes.map(n => n.id === note.id ? { ...n, deleted: true, deletedAt: Date.now() } : n);
      const newSha = await ghPutJSON(cfg, PATH_QUICK_NOTES, newNotes, quickSha, '빠른 기록 휴지통으로 이동');
      setQuickNotes(newNotes); setQuickSha(newSha);
      showToast('휴지통으로 이동했습니다.');
    } catch (err) {
      showToast('삭제 실패: ' + err.message);
    }
  };

  const handleRestoreNote = async note => {
    try {
      const newNotes = quickNotes.map(n => n.id === note.id ? { ...n, deleted: false, deletedAt: null } : n);
      const newSha = await ghPutJSON(cfg, PATH_QUICK_NOTES, newNotes, quickSha, '빠른 기록 복원');
      setQuickNotes(newNotes); setQuickSha(newSha);
      showToast('복원했습니다.');
    } catch (err) {
      showToast('복원 실패: ' + err.message);
    }
  };

  const handlePermanentDeleteNote = async note => {
    if (!window.confirm('완전히 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) return;
    try {
      const newNotes = quickNotes.filter(n => n.id !== note.id);
      const newSha = await ghPutJSON(cfg, PATH_QUICK_NOTES, newNotes, quickSha, '빠른 기록 영구 삭제');
      setQuickNotes(newNotes); setQuickSha(newSha);
      showToast('영구 삭제했습니다.');
    } catch (err) {
      showToast('삭제 실패: ' + err.message);
    }
  };

  const handleEditNoteSave = async (note, newText, keepImages, newFiles) => {
    setSavingNoteEdit(true);
    try {
      const uploadedRefs = [];
      for (const file of newFiles) {
        const id = `${Date.now()}-${Math.random().toString(16).slice(2, 8)}`;
        const thumbB64 = await compressImage(file);
        const thumbPath = `images/thumb/${id}.jpg`;
        await ghPutImage(cfg, thumbPath, thumbB64, '빠른 기록 사진 추가 (목록용)');
        const origB64 = await fileToBase64(file);
        const originalPath = `images/original/${id}.${extFromFile(file)}`;
        await ghPutImage(cfg, originalPath, origB64, '빠른 기록 사진 추가 (원본)');
        uploadedRefs.push({ thumb: thumbPath, original: originalPath });
      }
      const newNotes = quickNotes.map(n => n.id === note.id
        ? { ...n, text: newText, imageRefs: [...keepImages, ...uploadedRefs], updatedAt: Date.now() }
        : n);
      const newSha = await ghPutJSON(cfg, PATH_QUICK_NOTES, newNotes, quickSha, '빠른 기록 수정');
      setQuickNotes(newNotes); setQuickSha(newSha);
      showToast('수정했습니다.');
    } catch (err) {
      showToast('수정 실패: ' + err.message);
    } finally {
      setSavingNoteEdit(false);
    }
  };

  const handlePromote = note => {
    setPrefillNote(note);
    setEditingEntry(null);
    setModalOpen(true);
    setTab('entries');
  };

  const handleAddPhrase = async text => {
    try {
      const newPhrases = [...phrases, { id: uid(), text }];
      const newSha = await ghPutJSON(cfg, PATH_PHRASES, newPhrases, phrasesSha, '문구 템플릿 추가');
      setPhrases(newPhrases); setPhrasesSha(newSha);
    } catch (err) {
      showToast('저장 실패: ' + err.message);
    }
  };

  const handleDeletePhrase = async phrase => {
    try {
      const newPhrases = phrases.filter(p => p.id !== phrase.id);
      const newSha = await ghPutJSON(cfg, PATH_PHRASES, newPhrases, phrasesSha, '문구 템플릿 삭제');
      setPhrases(newPhrases); setPhrasesSha(newSha);
    } catch (err) {
      showToast('삭제 실패: ' + err.message);
    }
  };

  const handleToggleFavorite = async entry => {
    try {
      const newEntries = entries.map(e => e.id === entry.id ? { ...e, favorite: !e.favorite, updatedAt: Date.now() } : e);
      const newSha = await ghPutJSON(cfg, PATH_ENTRIES, newEntries, entriesSha, entry.favorite ? '즐겨찾기 해제' : '즐겨찾기 추가');
      setEntries(newEntries); setEntriesSha(newSha);
    } catch (err) {
      showToast('저장 실패: ' + err.message);
    }
  };

  const handleAddTodo = async ({ text, due }) => {
    try {
      const newTodos = [{ id: uid(), text, due, done: false, createdAt: Date.now(), updatedAt: Date.now() }, ...todos];
      const newSha = await ghPutJSON(cfg, PATH_TODOS, newTodos, todosSha, '할 일 추가');
      setTodos(newTodos); setTodosSha(newSha);
    } catch (err) {
      showToast('저장 실패: ' + err.message);
    }
  };
  const handleToggleTodo = async todo => {
    try {
      const newTodos = todos.map(t => t.id === todo.id ? { ...t, done: !t.done, updatedAt: Date.now() } : t);
      const newSha = await ghPutJSON(cfg, PATH_TODOS, newTodos, todosSha, '할 일 상태 변경');
      setTodos(newTodos); setTodosSha(newSha);
    } catch (err) {
      showToast('저장 실패: ' + err.message);
    }
  };
  const handleDeleteTodo = async todo => {
    try {
      const newTodos = todos.filter(t => t.id !== todo.id);
      const newSha = await ghPutJSON(cfg, PATH_TODOS, newTodos, todosSha, '할 일 삭제');
      setTodos(newTodos); setTodosSha(newSha);
    } catch (err) {
      showToast('삭제 실패: ' + err.message);
    }
  };

  const openNewEntry = () => { setEditingEntry(null); setPrefillNote(null); setModalOpen(true); };
  const openEditEntry = entry => { setEditingEntry(entry); setPrefillNote(null); setModalOpen(true); };
  const closeModal = () => { setModalOpen(false); setEditingEntry(null); setPrefillNote(null); };

  const handleSaveEntry = async data => {
    try {
      let newEntries;
      const extra = prefillNote ? { images: prefillNote.imageRefs || [], sourceNoteIds: [prefillNote.id] } : {};
      if (editingEntry) {
        newEntries = entries.map(e => e.id === editingEntry.id ? { ...e, ...data, updatedAt: Date.now() } : e);
      } else {
        const now = Date.now();
        newEntries = [{ id: uid(), ...data, ...extra, createdAt: now, updatedAt: now }, ...entries];
      }
      const newSha = await ghPutJSON(cfg, PATH_ENTRIES, newEntries, entriesSha, prefillNote ? '빠른 기록에서 일지 작성' : (editingEntry ? '일지 수정' : '새 일지 작성'));
      setEntries(newEntries); setEntriesSha(newSha);

      if (prefillNote) {
        const newNotes = quickNotes.map(n => n.id === prefillNote.id ? { ...n, processed: true, linkedEntryId: newEntries[0].id } : n);
        const newQSha = await ghPutJSON(cfg, PATH_QUICK_NOTES, newNotes, quickSha, '빠른 기록 정리 완료 처리');
        setQuickNotes(newNotes); setQuickSha(newQSha);
      }
      closeModal();
      showToast('저장했습니다.');
    } catch (err) {
      showToast('저장 실패: ' + err.message);
    }
  };

  const handleDeleteEntry = async entry => {
    if (!window.confirm(`"${entry.title}" 일지를 삭제할까요?`)) return;
    try {
      const newEntries = entries.filter(e => e.id !== entry.id);
      const newSha = await ghPutJSON(cfg, PATH_ENTRIES, newEntries, entriesSha, '일지 삭제');
      setEntries(newEntries); setEntriesSha(newSha);
      showToast('삭제했습니다.');
    } catch (err) {
      showToast('삭제 실패: ' + err.message);
    }
  };

  const requestNotifPermission = () => {
    if ('Notification' in window) Notification.requestPermission();
  };

  if (!cfg) {
    return (
      <div className="dark">
        <SettingsPanel onSave={handleSaveConfig} />
      </div>
    );
  }

  const overdueTodoCount = todos.filter(t => !t.done && t.due && daysUntil(t.due) <= 0).length;
  const unprocessedNoteCount = quickNotes.filter(n => !n.processed && !n.deleted).length;

  return (
    <div className="h-[100dvh] flex flex-col bg-[#F7F7F9] dark:bg-[#0B0E13] transition-colors overflow-hidden">
      <div className="flex-1 overflow-y-auto overflow-x-hidden" style={{ paddingTop: 'env(safe-area-inset-top, 0px)' }}>
        <div className="max-w-2xl lg:max-w-3xl xl:max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-5 sm:py-6">
          <header className="flex items-center justify-between mb-4">
            <Logo />
            <div className="flex items-center gap-1.5">
              <button onClick={loadAll} disabled={loading} title="새로고침"
                className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all disabled:opacity-50">
                <RefreshCw size={15} className={loading ? 'wj-spin' : ''} />
              </button>
              <button onClick={() => setTheme(t => (t === 'dark' ? 'light' : 'dark'))}
                className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all">
                {theme === 'dark' ? <Sun size={15} /> : <Moon size={15} />}
              </button>
            </div>
          </header>

          {syncError && (
            <div className="mb-4 flex items-center justify-between gap-2 rounded-lg border border-red-500/25 bg-red-500/10 px-3 py-2.5 text-[12px] text-red-400">
              <span className="break-words">{syncError}</span>
              <button onClick={loadAll} className="shrink-0 underline">재시도</button>
            </div>
          )}
          {!syncError && lastSynced && (
            <div className="mb-4 text-[10.5px] text-slate-400 dark:text-slate-600 font-mono">
              마지막 동기화 {fmtTime(lastSynced)} · 이 기기에서 새로고침해야 최신 상태가 반영돼요
            </div>
          )}

          {loading && !lastSynced ? (
            <div className="space-y-2.5">
              {[0, 1, 2].map(i => (
                <div key={i} className="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4 overflow-hidden relative">
                  <div className="h-3 w-24 rounded bg-slate-100 dark:bg-slate-800 animate-pulse mb-3" />
                  <div className="h-3.5 w-2/3 rounded bg-slate-100 dark:bg-slate-800 animate-pulse mb-2" />
                  <div className="h-3 w-full rounded bg-slate-100 dark:bg-slate-800 animate-pulse" />
                </div>
              ))}
            </div>
          ) : (
          <React.Fragment>
          {tab === 'quick' && <QuickCaptureTab cfg={cfg} notes={quickNotes} phrases={phrases} onAdd={handleAddNote} onDelete={handleDeleteNote} onRestore={handleRestoreNote} onPermanentDelete={handlePermanentDeleteNote} onEditSave={handleEditNoteSave} onPromote={handlePromote} uploading={uploading} savingEdit={savingNoteEdit} />}
          {tab === 'todos' && <TodoTab todos={todos} onAdd={handleAddTodo} onToggle={handleToggleTodo} onDelete={handleDeleteTodo} />}
          {tab === 'entries' && <EntriesTab cfg={cfg} entries={entries} onOpenNew={openNewEntry} onEdit={openEditEntry} onDelete={handleDeleteEntry} onToggleFavorite={handleToggleFavorite} />}
          {tab === 'settings' && (
            <div className="space-y-4">
              <SettingsPanel embedded initial={cfg} onSave={handleSaveConfig} onDisconnect={handleDisconnect} />
              <PhraseManager phrases={phrases} onAdd={handleAddPhrase} onDelete={handleDeletePhrase} />
              <div className="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2 text-[13px] text-slate-600 dark:text-slate-300"><BellIcon size={14} /> 할 일 알림</div>
                  <button onClick={requestNotifPermission} className="text-[11.5px] font-medium px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">권한 요청</button>
                </div>
                <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1.5 leading-relaxed">
                  이 앱을 열어뒀을 때만 뜨는 알림이에요. 폰이 잠겨있거나 앱을 닫았을 때 울리는 진짜 알람은 아닙니다.
                </p>
              </div>
            </div>
          )}
          </React.Fragment>
          )}
        </div>
      </div>

      <div className="shrink-0 px-3 pt-2" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 0.5rem)' }}>
        <div className="max-w-2xl lg:max-w-3xl xl:max-w-4xl mx-auto flex items-stretch rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/90 backdrop-blur-md shadow-[0_10px_30px_-6px_rgba(15,23,42,0.18)] dark:shadow-[0_10px_30px_-6px_rgba(0,0,0,0.5)] px-1 py-1">
          <TabButton active={tab === 'quick'} onClick={() => setTab('quick')} icon={Inbox} label="빠른 기록" badge={unprocessedNoteCount} />
          <TabButton active={tab === 'todos'} onClick={() => setTab('todos')} icon={ListChecks} label="할 일" badge={overdueTodoCount} />
          <TabButton active={tab === 'entries'} onClick={() => setTab('entries')} icon={FolderKanban} label="업무일지" badge={0} />
          <TabButton active={tab === 'settings'} onClick={() => setTab('settings')} icon={SettingsIcon} label="설정" badge={0} />
        </div>
      </div>

      <EntryFormModal open={modalOpen} initial={editingEntry} prefillNote={prefillNote} onClose={closeModal} onSave={handleSaveEntry} />
      <Toast message={toast} />
      <GlobalLightbox />
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
